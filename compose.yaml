# Development stack. Credentials here are local-only defaults; never reuse them elsewhere.
# The embedding/rerank model service is NOT in this file: it runs on the host so it can use
# the laptop GPU (see README). Containers reach it at host.docker.internal:8100.
name: mindnest

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://mindnest_app:mindnest_app@postgres:5432/mindnest
  MIGRATION_DATABASE_URL: postgresql+asyncpg://mindnest:mindnest@postgres:5432/mindnest
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://storage:9000
  S3_ACCESS_KEY: mindnest
  S3_SECRET_KEY: mindnest-secret
  S3_BUCKET: mindnest-materials
  MODEL_SERVICE_URL: http://host.docker.internal:8100
  CORS_ORIGINS: '["http://localhost:3000"]'
  ENVIRONMENT: development
  WEB_BASE_URL: http://localhost:3000
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  # Sign in with Google (optional). Put the values in .env; see docs/runbooks/google-oauth.md.
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  # Agent traces in LangSmith (optional; masked text only). Put the values in .env.
  AGENT_TRACING: ${AGENT_TRACING:-false}
  LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
  LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-mindnest-ai}
  RETRIEVAL_KEYWORD_RANKER: ${RETRIEVAL_KEYWORD_RANKER:-bm25}
  RETRIEVAL_ADVANCED_CANDIDATES: ${RETRIEVAL_ADVANCED_CANDIDATES:-vector}
  GUARDRAILS_ENABLED: ${GUARDRAILS_ENABLED:-true}
  GUARDRAILS_JUDGE: ${GUARDRAILS_JUDGE:-true}
  GUARDRAILS_JUDGE_TIMEOUT_SECONDS: ${GUARDRAILS_JUDGE_TIMEOUT_SECONDS:-8}

x-python-service: &python-service
  build:
    context: .
    dockerfile: infra/docker/api.Dockerfile
  image: mindnest-python:dev
  environment: *app-env
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mindnest
      POSTGRES_PASSWORD: mindnest
      POSTGRES_DB: mindnest
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/compose/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindnest -d mindnest"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Catches every email the app sends (verification, password reset) so nothing leaves the laptop.
  # Open http://localhost:8025 to read them.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  # S3-compatible object storage. MinIO removed its public images, so this uses RustFS
  # (still pre-1.0). Local development only; swap for a managed S3 service in production.
  storage:
    image: rustfs/rustfs:latest
    user: "0:0" # the image defaults to uid 10001, which cannot write to a fresh named volume
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: mindnest
      RUSTFS_SECRET_KEY: mindnest-secret
      RUSTFS_LOG_LEVEL: info
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storagedata:/data

  migrate:
    <<: *python-service
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *python-service
    command: ["uvicorn", "mindnest_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      calendar-mcp:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  # The only service that talks to Google Calendar. The API and the chat agents never hold a Google
  # token: they ask this service for one thing at a time, with a short-lived token made for that
  # call (docs/agents.md, "Calendar over MCP"). It is not published outside Docker.
  calendar-mcp:
    <<: *python-service
    command: ["python", "-m", "mindnest_calendar_mcp"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *python-service
    command:
      [
        "celery",
        "-A",
        "mindnest_worker.app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=2",
        "-Q",
        "default",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Evaluation runs, one at a time. Several runs at once would share the same provider key
  # and trip its rate limit, and a long run must not hold up uploads.
  eval-worker:
    <<: *python-service
    command:
      [
        "celery",
        "-A",
        "mindnest_worker.app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=1",
        "-Q",
        "eval",
        "-n",
        "eval@%h",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  storagedata:
